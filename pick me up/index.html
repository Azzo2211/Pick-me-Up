<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090d12" />
    <meta
      name="description"
      content="Riftward: gioco gestionale strategico con eroi autonomi, missioni persistenti e permadeath."
    />
    <title>Riftward // The Last Ascent</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>

    <div id="app" class="app-shell">
      <header class="topbar">
        <button class="brand" data-view="hub" aria-label="Apri il Nexus">
          <span class="brand-mark" aria-hidden="true">R</span>
          <span>
            <strong>RIFTWARD</strong>
            <small>THE LAST ASCENT</small>
          </span>
        </button>

        <div class="world-status" aria-label="Stato del mondo">
          <span class="status-pulse"></span>
          <span id="worldLabel">NEXUS // ONLINE</span>
        </div>

        <div class="resource-strip" aria-label="Risorse">
          <button class="resource" data-view="base" title="Oro disponibile">
            <span class="resource-icon gold-icon">G</span>
            <span><small>ORO</small><strong id="goldValue">0</strong></span>
          </button>
          <button class="resource" data-view="summon" title="Gemme disponibili">
            <span class="resource-icon gem-icon">◆</span>
            <span><small>GEMME</small><strong id="gemsValue">0</strong></span>
          </button>
          <button class="resource compact" data-view="base" title="Pietre promozione">
            <span class="resource-icon stone-icon">⬡</span>
            <span><small>PIETRE</small><strong id="stonesValue">0</strong></span>
          </button>
        </div>
      </header>

      <aside class="side-nav" aria-label="Navigazione principale">
        <nav>
          <button class="nav-item active" data-view="hub">
            <span class="nav-glyph">⌂</span><span>Nexus</span>
          </button>
          <button class="nav-item" data-view="tower">
            <span class="nav-glyph">△</span><span>Torre</span>
            <em id="floorBadge">01</em>
          </button>
          <button class="nav-item" data-view="heroes">
            <span class="nav-glyph">◈</span><span>Eroi</span>
            <em id="rosterBadge">0</em>
          </button>
          <button class="nav-item" data-view="squad">
            <span class="nav-glyph">⋈</span><span>Squadra</span>
            <em id="partyBadge">0/5</em>
          </button>
          <button class="nav-item" data-view="summon">
            <span class="nav-glyph">✦</span><span>Evoca</span>
          </button>
          <button class="nav-item" data-view="base">
            <span class="nav-glyph">▦</span><span>Base</span>
          </button>
          <button class="nav-item" data-view="archive">
            <span class="nav-glyph">≡</span><span>Archivio</span>
          </button>
        </nav>

        <div class="master-card">
          <div class="master-avatar">M</div>
          <div>
            <small>MASTER</small>
            <strong id="masterName">Aster</strong>
            <span id="masterRank">Rank E</span>
          </div>
          <button id="settingsButton" class="icon-button" aria-label="Impostazioni">⚙</button>
        </div>
      </aside>

      <main id="mainContent" class="main-content" tabindex="-1"></main>

      <footer class="mobile-nav" aria-label="Navigazione mobile">
        <button class="active" data-view="hub"><span>⌂</span>Nexus</button>
        <button data-view="tower"><span>△</span>Torre</button>
        <button data-view="heroes"><span>◈</span>Eroi</button>
        <button data-view="squad"><span>⋈</span>Squadra</button>
        <button data-view="summon"><span>✦</span>Evoca</button>
      </footer>
    </div>

    <section id="missionLayer" class="mission-layer" aria-label="Missione in corso" hidden>
      <canvas id="battleCanvas" aria-label="Campo di battaglia autonomo"></canvas>
      <div class="mission-vignette" aria-hidden="true"></div>
      <header class="mission-header">
        <div>
          <small id="missionStream">STREAM // UNKNOWN</small>
          <h1 id="missionTitle">PIANO 01</h1>
        </div>
        <div class="objective-card">
          <small>OBIETTIVO</small>
          <strong id="missionObjective">Elimina tutte le minacce</strong>
          <span id="missionProgress">Preparazione...</span>
        </div>
        <div class="mission-clock">
          <small>TEMPO SIM.</small>
          <strong id="missionClock">00:00</strong>
          <span class="live-tag">LIVE</span>
        </div>
      </header>

      <aside id="missionParty" class="mission-party"></aside>

      <aside class="event-console">
        <div class="console-head">
          <span>EVENT LOG</span><span id="threatLabel">THREAT // NOMINAL</span>
        </div>
        <div id="combatLog" class="combat-log" aria-live="polite"></div>
      </aside>

      <div class="macro-panel">
        <div class="macro-caption">
          <small>MASTER UPLINK</small>
          <span>Solo ordini macro. Gli eroi decidono come eseguirli.</span>
        </div>
        <div id="macroCommands" class="macro-commands">
          <button data-command="posture" data-cooldown="20">
            <span class="key-hint">1</span><strong>AVANZA</strong><small>Postura squadra</small>
          </button>
          <button data-command="focus" data-cooldown="30">
            <span class="key-hint">2</span><strong>ALTA MINACCIA</strong><small>Priorità bersagli</small>
          </button>
          <button data-command="protect" data-cooldown="30">
            <span class="key-hint">3</span><strong>PROTEGGI REAR</strong><small>Copertura alleati</small>
          </button>
          <button data-command="allout" data-cooldown="45">
            <span class="key-hint">4</span><strong>TUTTO PER TUTTO</strong><small>Consuma risorse</small>
          </button>
          <button class="danger-command" data-command="extract" data-cooldown="999">
            <span class="key-hint">X</span><strong>ESTRAZIONE</strong><small>6s · un tentativo</small>
          </button>
        </div>
      </div>
    </section>

    <div id="modalRoot" class="modal-root" hidden></div>
    <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>

    <script src="core.js"></script>
    <script src="combat.js"></script>
    <script src="app.js"></script>
  </body>
</html>
